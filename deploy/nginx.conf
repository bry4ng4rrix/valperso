# Application web (Flutter) et API sur le même port : la page appelle l'API à sa propre adresse,
# sans CORS. Les applications Android et Linux utilisent la même adresse (http://<serveur>:8020).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Photos des produits envoyées depuis l'application.
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;

    # API, photos et documentation (Swagger, ReDoc) : transmises au conteneur de l'API.
    location ~ ^/(api|media)/|^/(docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Application web : toujours revalidée (ETag), la nouvelle version est visible dès le déploiement.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
