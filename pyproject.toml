# Les dépendances sont listées dans requirements.txt / requirements-dev.txt.
# Ce fichier ne contient que la configuration des outils.

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
